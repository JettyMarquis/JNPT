name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Pure Swift Package Manager project — no .xcodeproj/.xcworkspace exists,
      # so `xcodebuild -scheme JettyNotepad` has no scheme to find and fails
      # immediately. Tests are a custom executable target (JettyNotepadTests),
      # not XCTest, so `swift test` doesn't apply either.
      - name: Build
        working-directory: JettyNotepad
        run: swift build

      - name: Test
        working-directory: JettyNotepad
        run: swift run JettyNotepadTests
